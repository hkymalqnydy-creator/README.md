<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250">
<!-- A generic modern SUV in side view, facing left (forward in Arabic reading order). No maker's badge or design.
     Made for the CROSSKY edition, here in the warm greys of متجر العاصمة; replace it with a real photo when there is one. -->
<defs>
  <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#f8f4f5"/><stop offset=".72" stop-color="#e6dcdf"/><stop offset="1" stop-color="#cdbfc4"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4a2e37"/><stop offset=".55" stop-color="#20151a"/><stop offset="1" stop-color="#130c0f"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="rim" cx=".42" cy=".38" r=".7">
    <stop offset="0" stop-color="#f8f4f5"/><stop offset=".6" stop-color="#d3cacd"/><stop offset="1" stop-color="#8f8589"/>
  </radialGradient>
  <filter id="soft" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="lower"><rect x="0" y="178" width="640" height="40"/></clipPath>
  <path id="body" d="M52 200 C34 200 26 192 26 178 L28 151 C30 139 38 132 54 129 L176 118 C192 116 205 111 217 103 L262 67 C270 60 280 57 292 57 L498 56 C518 56 531 60 540 70 L566 104 C572 112 576 120 578 131 L582 176 C583 192 576 200 562 200 L548 200 A56 56 0 0 0 436 200 L206 200 A56 56 0 0 0 94 200 Z"/>
  <g id="wheel">
    <circle r="46" fill="#151214"/>
    <circle r="42.5" fill="none" stroke="#2b2427" stroke-width="3"/>
    <circle r="31" fill="url(#rim)"/>
    <g fill="#1f1a1d">
      <path d="M0 -9 L6 -27 A28 28 0 0 1 16 -22 Z"/><path d="M0 -9 L6 -27 A28 28 0 0 1 16 -22 Z" transform="rotate(72)"/>
      <path d="M0 -9 L6 -27 A28 28 0 0 1 16 -22 Z" transform="rotate(144)"/><path d="M0 -9 L6 -27 A28 28 0 0 1 16 -22 Z" transform="rotate(216)"/>
      <path d="M0 -9 L6 -27 A28 28 0 0 1 16 -22 Z" transform="rotate(288)"/>
    </g>
    <circle r="8" fill="#e5dee0"/><circle r="3.2" fill="#6b6266"/>
  </g>
</defs>
<ellipse cx="318" cy="238" rx="292" ry="9" fill="#14070b" opacity=".42" filter="url(#soft)"/>
<!-- roof rails -->
<path d="M306 52 L492 51" stroke="#211b1f" stroke-width="5" stroke-linecap="round"/>
<path d="M318 52 v5 M480 51 v5" stroke="#211b1f" stroke-width="5"/>
<use href="#body" fill="url(#paint)"/>
<!-- dark lower cladding and arch mouldings -->
<use href="#body" fill="#221b1f" clip-path="url(#lower)"/>
<path d="M548 200 A56 56 0 0 0 436 200 M206 200 A56 56 0 0 0 94 200" fill="none" stroke="#221b1f" stroke-width="9"/>
<!-- greenhouse -->
<path d="M230 107 L268 71 C273 66 279 64 288 64 L494 63 C505 63 513 66 519 74 L539 101 C542 106 540 111 533 111 L238 113 C228 113 224 111 230 107 Z" fill="url(#glass)"/>
<path d="M262 76 L300 66 L330 66 L262 104 Z" fill="#fff" opacity=".10"/>
<rect x="336" y="63" width="11" height="50" fill="#141012"/>
<path d="M446 63 L462 63 L466 111 L450 112 Z" fill="url(#paint)"/>
<!-- side sculpting: shoulder highlight over a soft crease -->
<path d="M60 141 C200 134 400 132 572 131" fill="none" stroke="#fff" stroke-width="3" opacity=".75"/>
<path d="M60 145 C200 138 400 136 572 135" fill="none" stroke="#aea3a8" stroke-width="1.6" opacity=".55"/>
<path d="M120 172 C260 166 420 165 556 164" fill="none" stroke="#b9aeb2" stroke-width="1.4" opacity=".45"/>
<!-- door seams and handles -->
<path d="M341 114 L338 196 M451 114 L447 176" fill="none" stroke="#ada3a7" stroke-width="1.6"/>
<rect x="292" y="128" width="24" height="6" rx="3" fill="#bdb5b8"/><rect x="404" y="127" width="24" height="6" rx="3" fill="#bdb5b8"/>
<!-- mirror -->
<path d="M224 106 C220 98 228 92 240 93 L252 96 C256 99 254 106 248 108 Z" fill="url(#paint)" stroke="#d4cacd" stroke-width="1"/>
<path d="M230 108 L248 108 L246 113 L232 113 Z" fill="#221b1f"/>
<!-- front: grille, slim LED headlight, lower light -->
<path d="M27 154 C27 147 31 142 38 141 L45 141 L43 184 L31 184 C28 184 27 180 27 176 Z" fill="#19151a"/>
<path d="M30 157 h13 M30 165 h13 M30 173 h13" stroke="#4d3c43" stroke-width="2"/>
<path d="M34 141 L43 131 L104 123 L110 128 L94 137 L40 144 Z" fill="#221b1f"/>
<path d="M46 134 L102 126.5" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/>
<ellipse cx="62" cy="138" rx="9" ry="3.2" fill="#f7dfe5" opacity=".9"/>
<path d="M36 189 h16" stroke="#f5eaed" stroke-width="3" stroke-linecap="round"/>
<!-- rear light -->
<path d="M567 108 L576 120 L578 134 L568 130 Z" fill="#c62828"/>
<path d="M569 113 L576 124" stroke="#ff8a80" stroke-width="2" stroke-linecap="round"/>
<use href="#wheel" x="150" y="192"/>
<use href="#wheel" x="492" y="192"/>
</svg>
