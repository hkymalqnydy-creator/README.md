# Builds an installable Android APK on every push to main (and on demand).
# Download it from the run page: Actions → Android APK → Artifacts.
name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'config.js', 'js/**', 'css/**', 'icons/**', 'packaging/android-ios/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Create the Android project
        working-directory: packaging/android-ios
        run: |
          npm install
          npm run android
      - name: Build the APK
        working-directory: packaging/android-ios/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: sparat-android
          path: packaging/android-ios/android/app/build/outputs/apk/debug/*.apk
