; Copy this file to sparat_sync.ini (same folder as sparat_sync.py) and fill it in.
[sync]
; Supabase project address and public key: the same values as in config.js
url = https://YOUR-PROJECT.supabase.co
anon = YOUR-PUBLIC-KEY
; the link key created in the app: Admin panel -> Sales system -> Create link key
key = PASTE-THE-LINK-KEY
; the items file your sales system exports (Excel .xlsx or CSV)
file = C:\Sales\items.xlsx
; with --watch: how often to check the file, in seconds
every = 60
