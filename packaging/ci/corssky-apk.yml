# Builds the Corssky Android APK whenever corssky/ changes (and on demand).
# Download it from the run page: Actions → Corssky APK → Artifacts.
name: Corssky APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['corssky/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Create the Android project
        working-directory: corssky/packaging/android-ios
        run: |
          npm install
          npm run android
      - name: Build the APK
        working-directory: corssky/packaging/android-ios/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: corssky-android
          path: corssky/packaging/android-ios/android/app/build/outputs/apk/debug/*.apk
